name: Build installers

# Tagging a version builds the installers and attaches them to a GitHub
# Release. "Run workflow" in the Actions tab builds them on demand without
# creating a release, for testing a change before tagging it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is the department's platform. Each architecture is a separate
          # job so it can rebuild the native SQLite module for its own target:
          # packaging both from one invocation reuses whatever node_modules
          # holds, which put an arm64 binary inside the Intel app.
          #
          # GitHub's Intel macOS runners have been retired, so both are built on
          # the Apple Silicon runner and the x64 module is cross-compiled.
          - os: macos-latest
            target: dist:mac:arm64
            artifact: macos-apple-silicon
            pattern: 'release/*.dmg'
            expect_arch: arm64
          - os: macos-latest
            target: dist:mac:x64
            artifact: macos-intel
            pattern: 'release/*.dmg'
            expect_arch: x86_64
          - os: windows-latest
            target: dist:win
            artifact: windows-installer
            pattern: 'release/*.exe'
            expect_arch: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build installer
        run: npm run ${{ matrix.target }}

      # The failure this guards against is silent: the app packages and the
      # installer opens, then the application dies on launch because its native
      # module is built for the wrong architecture. Check the binary itself
      # rather than trusting the build flags.
      - name: Verify native module architecture
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          binary=$(find release -name 'better_sqlite3.node' -not -path '*/node_modules/.cache/*' | head -1)
          if [ -z "$binary" ]; then
            echo "::error::better_sqlite3.node not found in the packaged app"
            exit 1
          fi
          echo "Found: $binary"
          file "$binary"
          if ! file "$binary" | grep -q '${{ matrix.expect_arch }}'; then
            echo "::error::Expected ${{ matrix.expect_arch }} but the packaged module is a different architecture"
            exit 1
          fi
          echo "Architecture is ${{ matrix.expect_arch }} as expected."

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
